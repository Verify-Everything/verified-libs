name: toolchain-image
# Builds the pinned toolchain container for admission gate 9 (container/Dockerfile) and, on main,
# pushes it to GitHub Container Registry. Then pin it: copy the digest from the run summary into
# toolchain/versions.toml [container].digest in a PR (that PR's verify job runs inside it).
on:
  push:
    branches: [main]
    paths:
      - container/**
      - .dockerignore
      - toolchain/**
      - install.sh
      - bin/vkit.py
      - bin/vpipe.py
      - bin/standards.py
      - self/gate.py
      - selftest/**
  pull_request:
    paths:
      - container/**
      - .dockerignore
      - toolchain/**
      - install.sh
      - bin/vkit.py
      - bin/vpipe.py
      - bin/standards.py
      - self/gate.py
      - selftest/**
  workflow_dispatch:
permissions:
  contents: read
  packages: write   # used only on main / manual runs, to push the image
env:
  IMAGE: ghcr.io/verify-everything/verified-libs-toolchain
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Free disk (the image is about 19 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift
          docker system prune -af
          df -h /
      - name: Build
        run: docker build -f container/Dockerfile -t "$IMAGE:${{ github.sha }}" .
      - name: Smoke test (engine gate inside the image, repo mounted read-write)
        run: docker run --rm -v "$PWD:/work" "$IMAGE:${{ github.sha }}" python3 self/gate.py
      - name: Push and report the digest
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${{ github.sha }}" | cut -d@ -f2)
          {
            echo "### Toolchain image"
            echo '```'
            echo "$IMAGE@$digest"
            echo '```'
            echo "To pin it, set in toolchain/versions.toml:"
            echo '```toml'
            echo '[container]'
            echo "image = \"$IMAGE\""
            echo "digest = \"$digest\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

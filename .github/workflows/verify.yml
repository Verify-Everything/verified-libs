name: verify
# PRs: fast checks, the engine gate, and every library the PR touches (results uploaded).
# main + weekly: re-run and commit results/ so the repo always shows checked numbers.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["results/**"]
  schedule: [{ cron: "17 4 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_structure.py
      - run: python3 scripts/check-repo.py
      - run: bash install.sh --dry-run --yes --agents none --tools none

  verify:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write   # used only on main/schedule to commit results/
      packages: read    # pull the pinned toolchain image from GHCR, public or not
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Read the container pin (toolchain/versions.toml [container])
        id: pin
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import tomllib
          c = tomllib.load(open("toolchain/versions.toml", "rb")).get("container", {})
          print("image=" + c.get("image", "ghcr.io/verify-everything/verified-libs-toolchain"))
          print("digest=" + c.get("digest", ""))
          PY
      - name: Free disk for the toolchain image (about 19 GB unpacked)
        if: steps.pin.outputs.digest != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift
      - name: Log in to GHCR
        if: steps.pin.outputs.digest != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      # Without a pinned image (gate 9 then fails for every entry), install the tools on the runner.
      - uses: actions/setup-python@v5
        if: steps.pin.outputs.digest == ''
        with: { python-version: "3.12" }
      - uses: cachix/install-nix-action@v31
        if: steps.pin.outputs.digest == ''
      - name: Cache toolchains and mathlib
        if: steps.pin.outputs.digest == ''
        uses: actions/cache@v4
        with:
          path: |
            ~/.vpipe
            ~/.elan
            ~/.rustup
          key: tools-${{ hashFiles('toolchain/versions.toml') }}
      - name: Install
        if: steps.pin.outputs.digest == ''
        run: |
          # aarch64 crosscheck models (crc32fast); the pinned image has these too
          sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static gcc-aarch64-linux-gnu
          bash install.sh --yes --agents none --tools lean,framac,cbmc
          echo "$HOME/.vpipe/bin" >> "$GITHUB_PATH"
      - name: Pick libraries and entries
        id: libs
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
            libs=$( { echo "$changed" | sed -nE 's#^libraries/([^/]+)/.*#\1#p'
                      echo "$changed" | sed -nE 's#^(candidates|libs)/([^/]+/[^/]+)/.*#\2#p'; } | sort -u | tr '\n' ' ')
          else
            libs=$( { ls libraries; ls -d candidates/*/*/ libs/*/*/ 2>/dev/null | sed -E 's#^[^/]+/##; s#/$##'; } | tr '\n' ' ')
          fi
          echo "libs=$libs" >> "$GITHUB_OUTPUT"
      - name: Gate and runs
        env:
          IMAGE: ${{ steps.pin.outputs.image }}
          DIGEST: ${{ steps.pin.outputs.digest }}
          VPIPE_CI_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$DIGEST" ]; then
            docker run --rm -v "$PWD:/work" -e VPIPE_CONTAINER_DIGEST="$DIGEST" -e VPIPE_CI_RUN \
              "$IMAGE@$DIGEST" bash scripts/ci-run.sh ${{ steps.libs.outputs.libs }}
          else
            bash scripts/ci-run.sh ${{ steps.libs.outputs.libs }}
          fi
          cat results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results, path: results/ }
      - name: Commit results
        if: github.event_name != 'pull_request' && always()
        run: |
          git config user.name "verify-bot"; git config user.email "verify-bot@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || { git commit -m "results: update from CI run ${{ github.run_id }}"; git push; }

name: verify
# PRs: fast checks, the engine gate, and every library the PR touches (results uploaded).
# main + weekly: re-run and commit results/ so the repo always shows checked numbers.
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["results/**"]
  schedule: [{ cron: "17 4 * * 1" }]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_structure.py
      - run: python3 scripts/check-repo.py
      - run: bash install.sh --dry-run --yes --agents none --tools none

  verify:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: write   # used only on main/schedule to commit results/
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: cachix/install-nix-action@v31
      - name: Cache toolchains and mathlib
        uses: actions/cache@v4
        with:
          path: |
            ~/.vpipe
            ~/.elan
            ~/.rustup
          key: tools-${{ hashFiles('toolchain/versions.toml') }}
      - name: Install
        run: |
          bash install.sh --yes --agents none --tools lean,framac,cbmc
          echo "$HOME/.vpipe/bin" >> "$GITHUB_PATH"
      - run: vkit doctor || true
      - name: Engine gate
        run: python3 self/gate.py --full
      - name: Pick libraries
        id: libs
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            libs=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
                   | sed -nE 's#^libraries/([^/]+)/.*#\1#p' | sort -u | tr '\n' ' ')
          else
            libs=$(ls libraries | tr '\n' ' ')
          fi
          echo "libs=$libs" >> "$GITHUB_OUTPUT"
      - name: Run
        run: |
          fail=0
          for l in ${{ steps.libs.outputs.libs }}; do
            [ -f "libraries/$l/vpipe.toml" ] || continue
            vkit run "$l" || fail=1
            rm -rf "$HOME/vpipe-work/$l"   # keep runner disk free
          done
          vkit report
          cat results/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          exit $fail
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results, path: results/ }
      - name: Commit results
        if: github.event_name != 'pull_request' && always()
        run: |
          git config user.name "verify-bot"; git config user.email "verify-bot@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || { git commit -m "results: update from CI run ${{ github.run_id }}"; git push; }

note = "Wrong X2N_TABLE entry 16 (one bit off). Only used when len2 has bit 16 set (len2 >= 65536): Hasher::combine with a long second block, all builds; tests that the proof is not just checked on small lengths. Not equivalent: multiply(a', p) != multiply(a, p) for p != 0 since multiply is a field product mod P."

[[mutant]]

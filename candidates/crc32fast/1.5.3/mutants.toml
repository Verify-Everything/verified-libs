replace = "for i in 0..31 {"
note = "multiply drops the lowest coefficient bit of a (bit 0, i = 31). Wrong whenever an X2N entry with bit 0 set is used, e.g. entry 4 (0xa06a2517) for len2 with bit 4 set (len2 = 16). Hasher::combine on all builds and the aarch64 3-stream combine. Not equivalent: the dropped term b*x^31 mod P is nonzero for nonzero b."

[[mutant]]
file = "src/lib.rs"
find = "Self::new_with_initial_len(init, 0)"
replace = "Self::new_with_initial_len(init, 1)"
note = "new_with_initial (and so new/default/hash) starts the byte count at 1. All builds. Breaks total_len and Hasher::combine (other.amount is one too many, so the first CRC is shifted by an extra zero byte). Not equivalent: total_len() of a fresh Hasher is 1, not 0; combine of two Hasher::new() states gives a different CRC."

[[mutant]]
file = "src/lib.rs"
find = "self.amount = self.amount.wrapping_add(buf.len() as u64);"
replace = "self.amount = self.amount.saturating_add(buf.len() as u64);"
note = "Byte count saturates instead of wrapping mod 2^64. All builds. Only differs on overflow, e.g. new_with_initial_len(0, u64::MAX) then update(b\"a\"): total_len is u64::MAX instead of 0. Tests the 'amount wraps mod 2^64' claim; not equivalent for that input."


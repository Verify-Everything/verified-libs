replace = "0x0D7139D6"
note = "Wrong last entry of the slice-by-16 table CRC32_TABLE[15][255]. Used only by fold_16 when the low byte of (block[0..4] ^ crc) is 0xFF, never by update_slow: portable builds (riscv64, no_std x86/aarch64, std fallback), len >= 16. Not equivalent: flips bit 0 of the CRC for such inputs. Tests that the proof checks all 16 tables, not only table 0."

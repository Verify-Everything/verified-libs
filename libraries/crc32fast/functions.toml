# Per-function claims for crc32fast (read by vpipe). Every function: label, theorems, and a fix
# patch where the code was changed. Theorem names are per variant (see the note).

[[function]]
id = "src/baseline.rs:fold_16"
theorems = ["fold_16_eq"]
label = "full-correctness"
note = "16 bytes at a time with the slice-by-16 table = spec"


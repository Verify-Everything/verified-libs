# Library manifest. `vpipe run crc32fast` reads this. Created 2026-10-24.
name = "crc32fast"
lang = "rust"
tool = "lean-aeneas"
upstream = "https://github.com/srijs/rust-crc32fast"
commit = "d2363eab95ebc85fcf726d1c8fa845148e474591"   # v1.5.3
version = "1.5.3"
thread = "Verify crc32fast in Lean"

[extract]
crate_dir = "."
module = "Crc32fast"
charon_args = ["--preset=aeneas"]
# Portable no_std path: on riscv64 the crate's cfg turns the SIMD state into an empty enum,
# so the SIMD code drops out with no source edits.
cargo_args = ["--no-default-features", "--target", "riscv64gc-unknown-none-elf"]
sysroot_default = true
aeneas_args = []

[scope]
properties = [
  "update_slow, update_fast_16 and hash equal the bit-at-a-time reference CRC-32",
  "Hasher::update then finalize equals hash of the concatenated input (incremental = single pass)",
  "combine and Hasher::combine equal the CRC of the concatenation",
]
exclusions = [
  "SIMD paths (specialized::pclmulqdq, aarch64) are not extracted",
  "Hasher::update assumes the u64 byte counter does not overflow (Aeneas models overflow as a panic)",
  "Debug formatting (fmt) stays axiomatic and is unused by the theorems",
]

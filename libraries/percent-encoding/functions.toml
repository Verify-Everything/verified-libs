lean = "PercentEncode.Insts.CoreIterTraitsIteratorIteratorSharedAStr.next"
theorems = ["encode_next_spec", "next_chunk_spec"]
status = "open"
why = "original body proved equal to the patched body in Creusot (creusot/run.sh, run by hand 2026-10-25); vpipe and CI do not run that check yet, so gate 1 is not re-checked"
note = "Lean proves the patched body (next_chunk); creusot/encode proves original == patched (spec chunk_ok/step), 7/7 planted bugs rejected"


# Per-function evidence for percent-encoding (vpipe reads this).
# Upstream lines and patched-code lines differ (rust/aeneas-friendly.patch), so each entry names
# the Lean def it was extracted to and the proved theorems that specify it.
# Derived impls (Clone, PartialEq, Eq, Debug) are not `fn`s in the source, so the scanner does not
# list them; their theorems are in Proofs/Traits.lean (all proved except PercentDecode's derived
# Debug, which Aeneas cannot translate).

[[function]]
id = "src/ascii_set.rs:AsciiSet::contains"
lean = "ascii_set.AsciiSet.contains"
theorems = ["contains_spec"]
label = "full-correctness"

[[function]]
id = "src/ascii_set.rs:AsciiSet::should_percent_encode"
lean = "ascii_set.AsciiSet.should_percent_encode"
theorems = ["should_percent_encode_spec"]
label = "full-correctness"

[[function]]
id = "src/ascii_set.rs:AsciiSet::add"
lean = "ascii_set.AsciiSet.add"
theorems = ["add_spec", "add_nonascii_panics"]
label = "full-correctness"
note = "panics (array index out of bounds) for bytes >= 128; proved, undocumented upstream"

[[function]]
id = "src/ascii_set.rs:AsciiSet::remove"
lean = "ascii_set.AsciiSet.remove"
theorems = ["remove_spec", "remove_nonascii_panics"]
label = "full-correctness"
note = "panics (array index out of bounds) for bytes >= 128; proved, undocumented upstream"


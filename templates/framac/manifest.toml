# Library manifest. `vpipe run {name}` reads this. Created {date}.
name = "{name}"
lang = "{lang}"
tool = "{tool}"
upstream = "{upstream}"
commit = "{commit}"
version = "{version}"
archive_sha256 = ""          # SHA-256 of `git archive <commit>`; copy it from the first run's CLAIM.md
thread = ""

[framac]
# Files to analyse, relative to the repo. Annotated copies in libraries/{name}/src/ override them.
files = []
cpp_args = []                # e.g. ["-cpp-extra-args=-DINI_USE_STACK=1"]
functions = []               # empty = every function in the files
wp_args = ["-wp-rte"]        # -wp-rte adds runtime-error goals (overflow, bounds, null)

# ---- Admission standard (verified-libs). `vpipe card` shows which of the ten gates pass. ----

[scope]
summary = ""                 # what the library promises, in plain words (CLAIM.md "Plain words")
properties = []              # success criteria; vpipe refuses to prove while this is empty
spec_files = []              # formal spec files, relative to proof/
test_vectors = []            # published vectors or the standard the spec matches (e.g. "RFC 3986 2.1")
written = ""                 # date the criteria were written (before proof work)
reviewed_by = ""             # maintainer who reviewed them (not the proof author)
exclusions = []              # recorded for history only: no exclusion counts toward admission

[coverage]
targets = []                 # every Cargo feature / build option and target covered, e.g. ["x86_64 std", "no_std"]

[trust]
models = []                  # std or library models (axioms) the proofs rely on, each with its test
axioms = []                  # any other assumption the checker reports
tool_assumptions = ""
unsafe = ""                  # unsafe / FFI boundaries and how each is proved
# model_crate = false        # true if proofs are about a hand-written model of the code
# model_equivalence = []     # proved theorems that the model equals the real code

[crosscheck]
commands = []                # differential tests of the translation vs the compiled upstream library;
                             # {{tree}} {{proj}} {{build}} expand

[review]
author = ""                  # proof author (cannot review)
maintainer = ""              # name, date
adversarial = ""             # review session/report link, date

# ---- Optional: build-option matrix, own Frama-C image, WP plugins (inih thread, vpipe 0.2.32) ----
# [framac]
# image = "fv-framac:32.1"           # run frama-c inside this docker image; its version is recorded
# provers = ["alt-ergo", "z3", "cvc5"]
# [[framac.plugin]]                  # -load-module; a trusted-base change, pinned by sha256 of the source
# source = "prune/inih_prune.ml"
# sha256 = "<sha256 of the source>"
# build = "ocamlfind ... -o inih_prune.cmxs inih_prune.ml"   # optional: run in the image, in the plugins folder
# output = "inih_prune.cmxs"         # the file build makes; its sha256 is recorded
# note = "WP strategy: drops hypotheses only (sound by construction)"
# [framac.matrix]
# file = "cfgs.txt"                  # one configuration per line: preprocessor flags, or "default"
# wp_timeouts = [60, 300]            # retry a configuration with open goals at the next timeout
# smoke_tests = true                 # a failed smoke test (dead code) keeps the function open
# wp_args = ["-wp-auto", "inih:prune"]
# [[framac.matrix.rule]]             # configurations whose line contains `match`
# match = "INIH_PROOF_STRING"        # substring of the line; or line = "<exact cfgs.txt line>" (use line for expect_dead)
# wp_args = ["-wp-model", "Typed+Cast"]
# functions = ["ini_rstrip", "ini_parse_string"]   # -wp-fct list for these configurations
# expect_dead = [{{ file = "ini.c", line = 123, reason = "INI_MAX_LINE=2 cannot hold \"[a]\"" }}]   # listed in CLAIM.md

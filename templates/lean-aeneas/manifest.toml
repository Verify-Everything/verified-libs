# Library manifest. `vpipe run {name}` reads this. Created {date}.
name = "{name}"
lang = "{lang}"
tool = "{tool}"
upstream = "{upstream}"
commit = "{commit}"          # pin exactly; bump to re-verify a new release
version = "{version}"
thread = ""                  # project thread working on it, if any

[extract]
crate_dir = "."              # crate path inside the repo
module = "{module}"          # Lean module prefix; output goes to libraries/{name}/{module}/Extracted
charon_args = ["--preset=aeneas"]
# Portable no_std path, skips SIMD/arch code without source edits (needs a no_std-capable crate):
# cargo_args = ["--no-default-features", "--target", "riscv64gc-unknown-none-elf"]
# sysroot_default = true     # required with a cross target
cargo_args = []
# cargo_lock = "Cargo.lock"   # reviewed lockfile in libraries/<lib>/; if present, cargo runs --locked
aeneas_args = []

[scope]
# What "verified" means for this library. The agent and the report both read this.
properties = []              # e.g. "decode(encode(x)) == x for all byte strings"
exclusions = []              # e.g. "SIMD path", "functions using unsafe"

# Optional. Source rewrites that make the crate Aeneas-friendly, applied to a fresh copy of the
# pinned checkout before Charon. Keep them small, state them in the report, and test them below.
# [patches]
# files = ["rust/aeneas-friendly.patch"]   # relative to libraries/<lib>/
# dir = "."                                # where `patch -p1` runs, relative to the repo root
#
# [test]                                   # run on the patched tree; any failure stops the run
# commands = ["cd percent_encoding && cargo +stable test --quiet"]   # {{src}} {{tree}} {{proj}} expand
#
# More [extract] options:
# postprocess = ["pipeline/postprocess.py"] # python3 -I <script> <Extracted dir>, after Aeneas
# allowed_errors = ["Joining region abstractions", "Unimplemented"]  # any other Aeneas error fails
# strict_externals = true                   # fail if Aeneas starts wanting different std models
# aeneas_args = ["-max-recdepth", "16384"]
# A per-library lakefile.lean.tmpl may add extra libs (e.g. a non-module lib when a needed
# Aeneas definition is not @[expose]).
